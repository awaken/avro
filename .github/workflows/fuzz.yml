on:
  workflow_dispatch:

name: run fuzz

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386"]
        target:
          - name: FuzzDecoder
            package: .
          - name: FuzzSchemaParse
            package: .
          - name: FuzzOCFDecoder
            package: ./ocf

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27"

      - name: Run fuzz target
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          FUZZ_NAME: ${{ matrix.target.name }}
          FUZZ_PACKAGE: ${{ matrix.target.package }}
        run: go test -run=^$ -fuzz="^${FUZZ_NAME}$" -fuzztime=30s -parallel=1 "${FUZZ_PACKAGE}"
